name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gates
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure pnpm
        uses: pnpm/action-setup@v4
      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
      - name: Repeat the complete quality gate
        run: pnpm verify:repeat
